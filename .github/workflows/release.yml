name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Validar e publicar a release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check release version
        run: ./scripts/check-version.sh

      - name: Test server and build
        run: npm run check

      - name: Prepare release notes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          version = Path('VERSION').read_text().strip()
          changelog = Path('CHANGELOG.md').read_text()
          section = changelog.split(f'## [{version}]', 1)[1]
          body = section.split('\n', 1)[1].split('\n## [', 1)[0].strip()
          Path('release-notes.md').write_text(body + '\n')
          PY

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --verify-tag
          --notes-file release-notes.md
          --title "Xilo Studio $GITHUB_REF_NAME"
