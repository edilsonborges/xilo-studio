server {
    listen 47653;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # As chaves de API do usuário ficam no localStorage: a CSP limita para onde
    # o app pode falar, caso algum script estranho consiga rodar na página.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self' https://api.openai.com https://generativelanguage.googleapis.com https://api.anthropic.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'";

    # Usado pelo scripts/update.sh para saber se o container subiu
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Arquivos com hash no nome: podem ficar em cache para sempre
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # O index.html nunca fica em cache, para um deploy novo aparecer na hora
    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri $uri/ /index.html;
    }
}
