services:
  web:
    build: .
    container_name: xilo-studio
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    # RESEND_API_KEY, RESEND_FROM e ADMIN_EMAILS ficam no .env desta máquina (fora do Git)
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "47653"
      DATABASE_PATH: /app/data/xilo.sqlite
      APP_ORIGIN: ${APP_ORIGIN:-https://xilo.edilson.dev}
      # a porta só aceita conexões locais, então o IP do visitante vem do túnel
      TRUST_CLOUDFLARE_IP: "true"
      # opencode-gateway nesta mesma máquina (texto e imagens pela assinatura);
      # a chave GATEWAY_API_KEY fica no .env
      VOICESTUDIO_URL: ${VOICESTUDIO_URL:-http://host.docker.internal:3900}
      GATEWAY_URL: ${GATEWAY_URL:-http://host.docker.internal:4097}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # só na própria máquina: quem expõe para a internet é o túnel do Cloudflare
      - "127.0.0.1:47653:47653"
    volumes:
      # usuários, senhas (hash) e sessões; não apague
      - xilo_data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:47653/healthz',{signal:AbortSignal.timeout(4000)}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  xilo_data:
