services:
  web:
    build: .
    container_name: xilo-studio
    restart: unless-stopped
    ports:
      # só na própria máquina: quem expõe para a internet é o túnel do Cloudflare
      - "127.0.0.1:47653:47653"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:47653/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
